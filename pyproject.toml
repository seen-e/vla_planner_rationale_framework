[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-planner-rationale"
version = "0.1.0"
description = "Three-stage retrospective VLA subtask planner rationale annotation framework"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25,<1",
  "av>=12",
  "opencv-python-headless>=4.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vla-planner = "planner_rationale.cli:main"

[tool.setuptools.packages.find]
include = ["planner_rationale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
